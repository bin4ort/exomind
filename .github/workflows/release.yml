name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          - arch: armv7h
            runs-on: ubuntu-24.04-arm
            # 32-bit ARM requires multiarch support
            extra-setup: |
              sudo dpkg --add-architecture armhf
              sudo apt-get update
              sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y base-devel make gcc curl dpkg-dev
          ${{ matrix.extra-setup }}

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          VERSION=$VERSION packaging/release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exomind-${{ matrix.arch }}
          path: dist/*
          retention-days: 7