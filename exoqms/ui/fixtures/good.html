<!DOCTYPE html>
<html lang="en">
<head>
  <title>Good UI — clean page (QA fixture for exoqms-ui)</title>
  <link rel="stylesheet" href="good.css">
</head>
<body class="page">
  <header class="topbar">
    <h1 class="brand">Good Page</h1>
    <nav class="nav">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/about">About</a>
      <a class="nav-link" href="/products">Products</a>
    </nav>
    <button class="icon-btn" aria-label="Cart">
      <svg class="icon" viewBox="0 0 24 24"><use href="#icon-cart"/></svg>
    </button>
  </header>

  <main class="content">
    <section class="hero">
      <h2 class="hero-title">Hero title</h2>
      <p class="hero-text">High contrast body copy on the dark hero panel.</p>
      <div class="actions">
        <button class="btn btn-primary">Buy now</button>
        <button class="btn btn-ghost">Learn more</button>
      </div>
    </section>

    <section class="cards">
      <div class="card card-a">
        <h3 class="card-title">Card A</h3>
        <p class="card-text">Feature one, described in readable ink.</p>
      </div>
      <div class="card card-b">
        <h3 class="card-title">Card B</h3>
        <p class="card-text">Feature two, described in readable ink.</p>
      </div>
      <div class="card card-c">
        <h3 class="card-title">Card C</h3>
        <p class="card-text">Feature three, described in readable ink.</p>
      </div>
    </section>

    <section class="form">
      <label class="field-label" for="email">Email</label>
      <input class="field-input" id="email" type="email" placeholder="you@example.com">
      <button class="btn btn-primary btn-submit">Submit</button>
    </section>
  </main>
</body>
</html>
